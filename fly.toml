# Fly.io deployment for the TrustShield backend (Dockerfile at the repo root).
# First time:  fly launch --no-deploy --copy-config   then set secrets (see .env.example) and  fly deploy
app = "trustshield-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUSTSHIELD_ENV = "production"
  MAX_CONCURRENT_ANALYSES = "2"
  ENABLE_SCHEDULER = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so the first scan never waits for a cold start
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
